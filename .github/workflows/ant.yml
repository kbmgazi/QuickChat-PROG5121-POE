name: Java CI with Ant

on:
  push:
    branches: [ "main", "part_2_message_functionality" ]
  pull_request:
    branches: [ "main", "part_2_message_functionality" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      - name: Download JUnit 4 Jars
        run: |
          mkdir -p lib
          curl -L -o lib/junit-4.13.2.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -L -o lib/hamcrest-core-1.3.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

      - name: Build and Test with Ant
        run: >
          ant -f build.xml
          -Dlibs.junit_4.classpath=lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar
          -Djavac.source=17
          -Djavac.target=17
          -Djavac.release=17
          clean test
